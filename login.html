<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tickitz Login">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/style/login.css">
</head>
<body>
    <div class="merk">
        <img src="./assets/img/tickitz-logo.png" alt="Tickitz">
    </div>

    <main>
    <div class="container">
        
        <div class="login-desc">
            <div class="wave-hand">
                <h1>Welcome Back👋</h1>
            </div>
            <div class="atention">
                <p>Sign in with your data that you entered during
                your registration</p>
            </div>
        </div>
        
        
        <form>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="terms">
                <label for="terms">I agree to terms & conditions</label>
            </div>
            
            <a href="home.html">
                <button type="button" class="btn-primary">Login</button>
            </a>
            
            
            
            <div class="social-login">
                <button type="button" class="social-btn">
                    <img src="./assets/img/flat-color-icons_google.svg" alt="Google">
                    Google
                </button>
                <button type="button" class="social-btn">
                    <img src="./assets/img/bx_bxl-facebook-circle.svg" alt="Facebook">
                    Facebook
                </button>
            </div>
        </form>
    </div>
    </main>
</body>
</html>
