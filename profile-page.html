<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/style/profile-page.css">
</head>
<body>
    <header class="header">
        <div class="nav-container">
            <a href="#" class="logo"><img src="./assets/img/tickitz 1.svg" alt=""></a>
            
            <nav class="nav-links">
                <a href="home.html" class="nav-link">Home</a>
                <a href="movie.html" class="nav-link">Movie</a>
                <a href="movie.html" class="nav-link">Buy Ticket</a>
            </nav>
            
            <button class="mobile-nav-toggle">☰</button>
            
            <div class="nav-right">
                <div class="location-dropdown">
                    <span>Location</span>
                    <svg width="12" height="8" viewBox="0 0 12 8" fill="currentColor">
                        <path d="M6 8L0 2L1.41 0.59L6 5.17L10.59 0.59L12 2L6 8Z"/>
                    </svg>
                </div>
                <button class="search-btn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                    </svg>
                </button>
                <div class="profile-avatar"></div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <div class="main-content">
            <!-- Profile Sidebar -->
            <aside class="profile-sidebar">
                <div class="info-header">
                    <span class="info-label">INFO</span>
                    <button class="menu-dots">⋯</button>
                </div>
                
                <div class="user-profile">
                    <div class="user-avatar"></div>
                    <h3 class="user-name">Raihan Insan Kamil</h3>
                    <p class="user-status">Moviegoers</p>
                </div>
                
                <div class="loyalty-section">
                    <h4 class="loyalty-title">Loyalty Points</h4>
                    <div class="loyalty-card">
                        <div class="loyalty-header">
                            <span class="loyalty-type">Moviegoers</span>
                            <span class="loyalty-star">★</span>
                        </div>
                        <div class="loyalty-points">
                            320<span class="points-unit">points</span>
                        </div>
                        
                    </div>
                    <div class="progress-section">
                            <div class="progress-text">180 points become a master</div>
                            <div class="progress-bar">
                                <div class="progress-fill"></div>
                            </div>
                     </div>
                </div>
            </aside>

            <!-- Content Area -->
            <main class="content-area">
                <!-- Tabs -->
                 <div class="upperContainer">
                <div class="tabs">
                    <a href="profile-page.html" class="tab active">Account Settings</a>
                    <a href="order-history.html" class="tab">Order History</a>
                </div>
                

                <!-- Form Container -->
                <div class="form-container">
                    <h2 class="section-title">Details Information</h2>
                    
                    <form>
                        <div class="form-grid">
                            <div class="form-field">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-input" value="Raihan">
                            </div>
                            <div class="form-field">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-input" value="Insan Kamil">
                            </div>
                            <div class="form-field">
                                <label class="form-label">E-mail</label>
                                <input type="email" class="form-input" value="raihankamil37@gmail.com">
                            </div>
                            <div class="form-field">
                                <label class="form-label">Phone Number</label>
                                <div class="phone-field">
                                    <input type="text" class="form-input" value="+62    |    8111727072">
                                </div>
                            </div>
                        </div>
                    </form>    
                </div>

                 <div class="password-section">
                            <h2 class="section-title">Account and Privacy</h2>
                            
                            <div class="form-grid">
                                <div class="form-field">
                                    <label class="form-label">New Password</label>
                                    <div class="password-field">
                                        <input type="password" class="form-input password-input" placeholder="Write your password">
                                        <button type="button" class="password-toggle">👁</button>
                                    </div>
                                </div>
                                <div class="form-field">
                                    <label class="form-label">Confirm Password</label>
                                    <div class="password-field">
                                        <input type="password" class="form-input password-input" placeholder="Confirm your password">
                                        <button type="button" class="password-toggle">👁</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                    <button type="submit" class="update-button">Update changes</button>
            </main>
        </div>
    </div>
</body>
</html>
