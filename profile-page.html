<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              mulish: ["Mulish", "sans-serif"],
            },
            colors: {
              main: "#1D4ED8",
              secondary: "#A0A3BD",
            },
          },
        },
      };
    </script>
    <style>
      .profile-avatar-bg {
        background: url(./assets/img/raihan.jpg);
        background-size: cover;
      }
      .user-avatar-bg {
        background: url(./assets/img/raihan.jpg);
        background-size: cover;
      }
      .loyalty-card::before {
        content: "";
        position: absolute;
        top: -50%;
        right: -20px;
        width: 60px;
        height: 200%;
        background: rgba(255, 255, 255, 0.1);
        transform: rotate(20deg);
      }
      .progress-fill {
        width: 64%;
      }
    </style>
  </head>
  <body
    class="font-mulish text-gray-800 leading-relaxed"
    style="background-color: rgba(160, 163, 189, 0.2)"
  >
    <!-- Header Navigation -->
    <header class="bg-white py-4 shadow-sm">
      <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
        <img src="./assets/img/tickitz 1.svg" alt="" />

        <nav class="hidden lg:flex gap-8">
          <a
            href="home.html"
            class="text-slate-500 text-sm font-medium hover:text-main transition-colors"
            >Home</a
          >
          <a
            href="movie.html"
            class="text-slate-500 text-sm font-medium hover:text-main transition-colors"
            >Movie</a
          >
          <a
            href="movie.html"
            class="text-slate-500 text-sm font-medium hover:text-main transition-colors"
            >Buy Ticket</a
          >
        </nav>

        <button class="lg:hidden text-slate-500 text-xl p-2">☰</button>

        <div class="hidden lg:flex items-center gap-4">
          <div
            class="flex items-center gap-1.5 text-slate-500 text-sm cursor-pointer px-3 py-2 rounded-md hover:bg-slate-50 transition-colors"
          >
            <span>Location</span>
            <svg width="12" height="8" viewBox="0 0 12 8" fill="currentColor">
              <path d="M6 8L0 2L1.41 0.59L6 5.17L10.59 0.59L12 2L6 8Z" />
            </svg>
          </div>
          <button
            class="text-slate-500 p-2 rounded-md hover:bg-slate-50 transition-colors"
          >
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path
                d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"
              />
            </svg>
          </button>
          <div class="w-9 h-9 rounded-full profile-avatar-bg"></div>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <div class="max-w-6xl mx-auto p-8">
      <div class="grid lg:grid-cols-[300px_1fr] gap-8 items-start">
        <!-- Profile Sidebar -->
        <aside class="bg-white rounded-xl p-6 shadow-sm">
          <div class="flex justify-between items-center mb-5">
            <span
              class="text-slate-400 text-xs font-semibold tracking-wider uppercase"
              >INFO</span
            >
            <button class="text-slate-400 text-base p-1 cursor-pointer">
              ⋯
            </button>
          </div>

          <div class="text-center mb-6">
            <div
              class="w-20 h-20 rounded-full user-avatar-bg mx-auto mb-3"
            ></div>
            <h3 class="text-lg font-semibold text-slate-800 mb-1">
              Raihan Insan Kamil
            </h3>
            <p class="text-slate-500 text-sm">Moviegoers</p>
          </div>

          <div class="mt-6">
            <h4 class="text-slate-500 text-sm mb-3">Loyalty Points</h4>
            <div
              class="bg-main rounded-xl p-5 text-white relative overflow-hidden loyalty-card"
            >
              <div class="flex justify-between items-center mb-3 relative z-10">
                <span class="text-sm font-medium">Moviegoers</span>
                <span class="text-yellow-400 text-xl">★</span>
              </div>
              <div class="text-3xl font-bold relative z-10">
                320<span class="text-xs font-normal ml-1">points</span>
              </div>
              <div class="mt-4 relative z-10">
                <div class="text-sm mb-3 opacity-90">
                  180 points become a master
                </div>
                <div class="h-1 bg-white/25 rounded-sm overflow-hidden">
                  <div
                    class="h-full bg-yellow-400 rounded-sm progress-fill"
                  ></div>
                </div>
              </div>
            </div>
          </div>
        </aside>

        <!-- Content Area -->
        <main class="min-h-96">
          <!-- Tabs -->
          <div
            class="flex border-b border-slate-200 mb-8 bg-white rounded-xl p-6 shadow-sm"
          >
            <a
              href="profile-page.html"
              class="py-3 pr-10 text-slate-800 text-sm font-medium relative"
            >
              Account Settings
              <div class="absolute bottom-0 left-0 right-0 h-0.5 bg-main"></div>
            </a>
            <a
              href="order-history.html"
              class="py-3 pr-10 text-slate-400 text-sm font-medium hover:text-main transition-colors"
            >
              Order History
            </a>
          </div>

          <!-- Form Container -->
          <div class="bg-white rounded-xl p-8 shadow-sm mb-6">
            <h2 class="text-base font-semibold text-slate-800 mb-6">
              Details Information
            </h2>

            <form>
              <div class="grid md:grid-cols-2 gap-6 mb-6">
                <div class="flex flex-col">
                  <label class="text-sm text-slate-500 mb-2">First Name</label>
                  <input
                    type="text"
                    class="px-4 py-3 border border-slate-200 rounded-lg text-sm bg-slate-50 transition-all focus:outline-none focus:border-main focus:bg-white"
                    value="Raihan"
                  />
                </div>
                <div class="flex flex-col">
                  <label class="text-sm text-slate-500 mb-2">Last Name</label>
                  <input
                    type="text"
                    class="px-4 py-3 border border-slate-200 rounded-lg text-sm bg-slate-50 transition-all focus:outline-none focus:border-main focus:bg-white"
                    value="Insan Kamil"
                  />
                </div>
                <div class="flex flex-col">
                  <label class="text-sm text-slate-500 mb-2">E-mail</label>
                  <input
                    type="email"
                    class="px-4 py-3 border border-slate-200 rounded-lg text-sm bg-slate-50 transition-all focus:outline-none focus:border-main focus:bg-white"
                    value="raihankamil37@gmail.com"
                  />
                </div>
                <div class="flex flex-col">
                  <label class="text-sm text-slate-500 mb-2"
                    >Phone Number</label
                  >
                  <input
                    type="text"
                    class="px-4 py-3 border border-slate-200 rounded-lg text-sm bg-slate-50 transition-all focus:outline-none focus:border-main focus:bg-white"
                    value="+62  |  8111727072"
                  />
                </div>
              </div>
            </form>
          </div>

          <!-- Password Section -->
          <div class="bg-white rounded-xl p-8 shadow-sm mb-8">
            <h2 class="text-base font-semibold text-slate-800 mb-6">
              Account and Privacy
            </h2>

            <div class="grid md:grid-cols-2 gap-6">
              <div class="flex flex-col">
                <label class="text-sm text-slate-500 mb-2">New Password</label>
                <div class="relative">
                  <input
                    type="password"
                    class="px-4 py-3 pr-12 border border-slate-200 rounded-lg text-sm bg-slate-50 transition-all focus:outline-none focus:border-main focus:bg-white w-full placeholder-slate-400"
                    placeholder="Write your password"
                  />
                  <button
                    type="button"
                    class="absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400 p-1 text-base hover:text-slate-500"
                  >
                    👁
                  </button>
                </div>
              </div>
              <div class="flex flex-col">
                <label class="text-sm text-slate-500 mb-2"
                  >Confirm Password</label
                >
                <div class="relative">
                  <input
                    type="password"
                    class="px-4 py-3 pr-12 border border-slate-200 rounded-lg text-sm bg-slate-50 transition-all focus:outline-none focus:border-main focus:bg-white w-full placeholder-slate-400"
                    placeholder="Confirm your password"
                  />
                  <button
                    type="button"
                    class="absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400 p-1 text-base hover:text-slate-500"
                  >
                    👁
                  </button>
                </div>
              </div>
            </div>
          </div>

          <button
            type="submit"
            class="bg-main text-white px-12 py-3.5 rounded-lg text-sm font-semibold transition-all hover:bg-blue-700 hover:-translate-y-0.5 hover:shadow-lg active:translate-y-0"
          >
            Update changes
          </button>
        </main>
      </div>
    </div>

    <script>
      // Password toggle functionality
      document.querySelectorAll('button[type="button"]').forEach((toggle) => {
        if (toggle.textContent.includes("👁")) {
          toggle.addEventListener("click", function () {
            const input = this.previousElementSibling;
            if (input.type === "password") {
              input.type = "text";
              this.src = "./assets/img/eye-slash-solid-full.svg";
            } else {
              input.type = "password";
              this.textContent = "👁";
            }
          });
        }
      });
    </script>
  </body>
</html>
